[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-dsl"
version = "0.1.0"
description = "Logical multi-board topology DSL for simulation-rl78-core"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["topology_dsl"]
package-dir = { "topology_dsl" = "." }
