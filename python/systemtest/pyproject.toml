[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemtest"
version = "0.1.0"
description = "Cluster simulation system-test harness"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pytest>=8",
]
# Install topology-dsl from this repo first:
#   pip install -e ../topology_dsl -e .

[project.entry-points.pytest11]
systemtest = "systemtest.plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["systemtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
