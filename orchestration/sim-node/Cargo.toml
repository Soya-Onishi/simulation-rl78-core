[package]
name = "sim-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Node process runtime (IPC / Probe / Simulation threads; issue #141 / #147)"
publish = false

[dependencies]
contract = { path = "../contract" }
log = "0.4"

[dev-dependencies]
axum = "0.8"
contract = { path = "../contract", features = ["test-support"] }
serde_json = "1"
sim-command = { path = "../sim-command", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
