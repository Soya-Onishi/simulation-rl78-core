[workspace]
members = [
    "hw/cpus/*",
    "hw/dac",
    "boards/rl78-minimal-board",
    "boards/boiler_board",
    "plants/minimal-plant",
    "plants/piping-plant",
    "plants/boiler-plant",
    "sim-kernel",
    "sim-cluster",
    "orchestration/contract",
    "orchestration/sim-command",
    "orchestration/sim-node",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

# sim-node relies on unwinding: a panicking thread must run its drop guards so
# the remaining threads shut down and `JoinHandle::join` reports the panic.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
