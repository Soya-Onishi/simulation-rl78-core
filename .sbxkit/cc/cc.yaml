# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: C/C++ build tools
description: >-
  Declaration-only mixin that installs cmake, ninja-build, and clangd with
  apt at sandbox create time. The DHI cursor base already provides gcc,
  make, and GNU binutils.
sourceUrl: https://github.com/Soya-Onishi/simulation-rl78-core
licenses: [MIT]
version: "1.1.0"

# Apt package versions come from the composed workload's mirrors at create
# time, so this kit does not claim versioned provides for cmake/etc.

capabilities:
  # Install hooks need the distro mirrors; the cursor workload already
  # allows them at runtime, but each kit must declare the phase it uses.
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - archive.ubuntu.com:80
          - security.ubuntu.com:80
          - ports.ubuntu.com:80
          - archive.ubuntu.com:443
          - security.ubuntu.com:443
          - ports.ubuntu.com:443
          # cursor workload base may use Debian / DHI apt sources
          - deb.debian.org:80
          - security.debian.org:80
          - deb.debian.org:443
          - security.debian.org:443
          - dhi.io:80
          - dhi.io:443

  # apt install libstdc++6 and /sbin/ldconfig is needed for vscode ssh remote access
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -eux
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v apt-get >/dev/null 2>&1; then
              echo "cc kit requires a Debian/Ubuntu-based workload with apt-get" >&2
              exit 1
            fi
            apt-get update
            apt-get install -y --no-install-recommends \
              cmake \
              ninja-build \
              clangd \
              libstdc++6
            /sbin/ldconfig
            rm -rf /var/lib/apt/lists/*
            cmake --version
            ninja --version
            clangd --version
          user: "0"
          env:
            - http_proxy
            - https_proxy
            - HTTP_PROXY
            - HTTPS_PROXY
            - no_proxy
            - NO_PROXY
          description: Install cmake, ninja-build, and clangd via apt

  # Accept one context version through runtime policy, or skip both.
  - type: com.docker.sandbox/agent-context@1
    optional: true
    config: &agent-context
      content: |
        ## C/C++ build tools

        At sandbox create, this kit installs via apt:

        - `cmake`
        - `ninja-build`
        - `clangd`

        The DHI cursor base already includes `gcc`, `make`, and GNU binutils
        (`readelf`, `nm`, `objdump`, …). Package versions follow the workload
        image's apt repositories.

  - type: com.docker.sandbox/agent-context@2
    optional: true
    config: *agent-context
