[package]
name = "sim-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-board cluster: topology, server, arbiter, and IPC helpers"

[[bin]]
name = "cluster-server"
path = "src/bin/cluster_server.rs"

[[bin]]
name = "cluster-arbiter"
path = "src/bin/cluster_arbiter.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
iceoryx2 = "0.9.3"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
iceoryx2-bb-system-types = "0.9.3"
sim-kernel = { path = "../sim-kernel" }

[dev-dependencies]
tempfile = "3"
