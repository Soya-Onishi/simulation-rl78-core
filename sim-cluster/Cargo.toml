[package]
name = "sim-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Multi-board cluster: topology, server, arbiter, and IPC helpers"

[[bin]]
name = "simulation-frontend"
path = "src/bin/simulation_frontend.rs"

[[bin]]
name = "cluster-backend"
path = "src/bin/cluster_backend.rs"

[[bin]]
name = "cluster-arbiter"
path = "src/bin/cluster_arbiter.rs"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["fs"] }
base64 = "0.22"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync"] }
ureq = "3.4.2"
url = "2"
gdbstub = "0.7"
iceoryx2 = "0.9.3"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
iceoryx2-bb-system-types = "0.9.3"
sim-kernel = { path = "../sim-kernel" }
log = "0.4"

[dev-dependencies]
tempfile = "3"
serial_test = "3.5.0"
