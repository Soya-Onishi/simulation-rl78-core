<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>シミュレーション</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    font-family: system-ui, sans-serif;
    background: #f4f5f7;
    color: #1c1e22;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px 16px;
    padding: 12px 16px;
    background: #fff;
    border-bottom: 1px solid #d8dbe2;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .actions { display: flex; gap: 8px; }
  button {
    border: 1px solid #c5cad3;
    background: #fff;
    border-radius: 6px;
    padding: 8px 14px;
    font: inherit;
    cursor: pointer;
  }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: #146c43; color: #fff; border-color: #146c43; }
  button.danger { background: #9b2c2c; color: #fff; border-color: #9b2c2c; }
  .time { margin-left: auto; text-align: right; }
  .time strong { font-size: 20px; font-variant-numeric: tabular-nums; }
  .time span, .meta { color: #5c6570; font-size: 12px; }
  #command-error, #status-error { width: 100%; color: #9b2c2c; font-size: 13px; }
  #create {
    max-width: 720px;
    margin: 24px auto;
    padding: 0 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #create form { display: flex; flex-direction: column; gap: 8px; }
  textarea {
    width: 100%;
    min-height: 220px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
  }
  #sim { display: none; flex: 1; flex-direction: column; min-height: 0; }
  #workspace {
    flex: 1;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #nodes {
    flex: 1;
    overflow: auto;
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    align-content: start;
  }
  #action-panel {
    flex-shrink: 0;
    height: 32vh;
    min-height: 280px;
    display: flex;
    flex-direction: column;
    background: #fff;
    border-top: 1px solid #d8dbe2;
  }
  #actionbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 12px;
    border-bottom: 1px solid #d8dbe2;
    font-weight: 650;
  }
  #actionview {
    flex: 1;
    overflow: auto;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
    align-content: start;
  }
  .action-card {
    border: 1px solid #d8dbe2;
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .action-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .action-card h3 { margin: 0; font-size: 15px; }
  .action-card label {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 13px;
  }
  .action-card input[type="number"] {
    width: 100%;
    padding: 6px 8px;
    font: inherit;
    border: 1px solid #c5cad3;
    border-radius: 6px;
  }
  #action-error, #action-status { padding: 0 12px; }
  #action-error:empty, #action-status:empty { display: none; }
  #action-error { color: #9b2c2c; font-size: 13px; }
  #action-status { color: #146c43; font-size: 13px; }
  .node {
    background: #fff;
    border: 1px solid #d8dbe2;
    border-radius: 8px;
    padding: 12px;
  }
  .node h2 { margin: 0 0 6px; font-size: 16px; }
  .node .state { font-weight: 650; }
  .state.running { color: #146c43; }
  .state.stopped, .state.ready, .state.starting { color: #8a5a00; }
  .state.exited { color: #9b2c2c; }
  #logs {
    flex-shrink: 0;
    height: 22vh;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    background: #111;
    color: #e7e7e7;
    border-top: 1px solid #000;
  }
  #logbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #1c1e22;
    color: #ddd;
  }
  #logbar label { display: flex; gap: 8px; align-items: center; }
  #probes {
    flex-shrink: 0;
    height: 14vh;
    min-height: 88px;
    display: flex;
    flex-direction: column;
    background: #111;
    color: #e7e7e7;
    border-top: 1px solid #000;
  }
  #probebar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 12px;
    background: #1c1e22;
    color: #ddd;
  }
  #probeview {
    flex: 1;
    overflow: auto;
    margin: 0;
    padding: 8px 12px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  #logview {
    flex: 1;
    overflow: auto;
    margin: 0;
    padding: 8px 12px;
    font-family: ui-monospace, monospace;
    font-size: 12px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .lv-error { color: #ff8d8d; }
  .lv-warn { color: #ffd27a; }
  .lv-info { color: #e7e7e7; }
  .lv-debug { color: #9ad; }
  .lv-trace { color: #8a8f98; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<section id="create">
  <h1>シミュレーションを作成</h1>
  <p class="meta">論理トポロジ JSON を POST します。Python DSL はクライアント側で JSON に変換してから貼り付けてください（例: <code>python -m topology_dsl run file.py</code>）。作成後は停止状態です。</p>
  <form id="topoform">
    <input id="topofile" type="file" accept=".json,application/json">
    <textarea id="topotext" placeholder='{"boards":[...],"edges":[...],"margin_ns":...,"headroom_threshold_ns":...}'></textarea>
    <button class="primary" type="submit">作成して開く</button>
  </form>
  <div id="create-error" class="meta" style="color:#9b2c2c"></div>
</section>

<section id="sim">
<header>
  <h1>シミュレーション</h1>
  <div class="meta" id="sim-id"></div>
  <div class="actions">
    <button id="start" class="primary" type="button">スタート</button>
    <button id="stop" class="danger" type="button">ストップ</button>
    <button id="reset" type="button">リセット</button>
    <a href="/" class="meta" style="align-self:center">新規作成</a>
  </div>
  <div class="time">
    <div class="meta">仮想時間</div>
    <strong id="vtime">—</strong>
    <div class="meta" id="vraw"></div>
  </div>
  <div id="command-error"></div>
  <div id="status-error"></div>
</header>
<div id="workspace">
<main id="nodes"></main>
</div>
<section id="action-panel">
  <div id="actionbar">
    <span>アクション</span>
    <button id="actions-refresh" type="button">再読み込み</button>
  </div>
  <div id="action-error" class="meta"></div>
  <div id="action-status" class="meta"></div>
  <div id="actionview"></div>
</section>
<section id="logs">
  <div id="logbar">
    <span>ログ</span>
    <label>表示レベル
      <select id="level">
        <option value="error">error</option>
        <option value="warn">warn</option>
        <option value="info" selected>info</option>
        <option value="debug">debug</option>
        <option value="trace">trace</option>
      </select>
    </label>
  </div>
  <pre id="logview"></pre>
</section>
<section id="probes">
  <div id="probebar">
    <span>プローブ</span>
    <button id="probes-csv" type="button" disabled>CSV</button>
  </div>
  <pre id="probeview"></pre>
</section>
</section>
<script>
const rank = { error: 1, warn: 2, info: 3, debug: 4, trace: 5 };
const logs = [];
let stick = true;
let simId = null;
let statusSource = null;
let logSource = null;
let probeSource = null;
const probeLive = new Map();
let actionCatalog = [];
let simState = null;
let actionPoll = null;
let actionBusy = false;

function pathId() {
  const path = location.pathname.replace(/\/+$/, "") || "/";
  if (path === "/") return null;
  return decodeURIComponent(path.slice(1));
}

function formatTime(ns) {
  if (ns == null) return "—";
  if (ns < 1000) return ns + " ns";
  if (ns < 1e6) return (ns / 1e3).toFixed(3) + " µs";
  if (ns < 1e9) return (ns / 1e6).toFixed(3) + " ms";
  return (ns / 1e9).toFixed(6) + " s";
}

function renderNodes(nodes) {
  const root = document.getElementById("nodes");
  root.replaceChildren();
  if (!nodes || nodes.length === 0) {
    const empty = document.createElement("p");
    empty.className = "meta";
    empty.textContent = "ノードはまだありません。";
    root.appendChild(empty);
    return;
  }
  for (const node of nodes) {
    const card = document.createElement("article");
    card.className = "node";
    const title = document.createElement("h2");
    title.textContent = node.id;
    const kind = document.createElement("div");
    kind.className = "meta";
    kind.textContent = node.kind || "";
    const state = document.createElement("div");
    state.className = "state " + (node.state || "");
    state.textContent = node.state || "";
    card.append(title, kind, state);
    root.appendChild(card);
  }
}

function renderLogs() {
  const selected = rank[document.getElementById("level").value] || 5;
  const view = document.getElementById("logview");
  const lines = [];
  for (const log of logs) {
    const level = log.level || "info";
    if ((rank[level] || 5) > selected) continue;
    const who = log.board ? ("node " + log.board) : (log.origin || "log");
    lines.push('<span class="lv-' + level + '">[' + level + "] " + who + ": " + escapeText(log.text || "") + "</span>");
  }
  view.innerHTML = lines.join("\n");
  if (stick) view.scrollTop = view.scrollHeight;
}

function escapeText(text) {
  return text.replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
}

function renderProbes() {
  const lines = [];
  for (const sample of probeLive.values()) {
    lines.push(sample.board + "/" + sample.probe + " " + sample.kind + " " + sample.value);
  }
  document.getElementById("probeview").textContent = lines.join("\n");
}

function canInvoke() {
  return simState === "running" && !actionBusy;
}

function setActionRunEnabled() {
  const enabled = canInvoke();
  document.querySelectorAll(".action-run").forEach((btn) => {
    btn.disabled = !enabled;
  });
}

function setButtons(state) {
  simState = state;
  const dead = state === "exited";
  document.getElementById("start").disabled = dead || state === "running";
  document.getElementById("stop").disabled = dead || state !== "running";
  document.getElementById("reset").disabled = dead;
  document.getElementById("probes-csv").disabled = state !== "stopped";
  setActionRunEnabled();
}

function setActionError(text) {
  document.getElementById("action-error").textContent = text || "";
}

function setActionStatus(text) {
  document.getElementById("action-status").textContent = text || "";
}

function actionKey(row) {
  return (row.board_id || "") + "/" + (row.device || "") + "/" + (row.action || "");
}

function paramHint(param) {
  const bits = [];
  if (param.unit) bits.push(param.unit);
  if (param.min != null) bits.push("min " + param.min);
  if (param.max != null) bits.push("max " + param.max);
  return bits.join(" · ");
}

function renderActions() {
  const root = document.getElementById("actionview");
  root.replaceChildren();
  if (!actionCatalog.length) {
    const empty = document.createElement("p");
    empty.className = "meta";
    empty.textContent = "アクションはまだありません。スタート後にボードが公開します。";
    root.appendChild(empty);
    return;
  }
  for (const row of actionCatalog) {
    const card = document.createElement("article");
    card.className = "action-card";
    const head = document.createElement("div");
    head.className = "action-card-head";
    const title = document.createElement("h3");
    title.textContent = row.action || "";
    const run = document.createElement("button");
    run.className = "primary action-run";
    run.type = "button";
    run.textContent = "実行";
    run.disabled = !canInvoke();
    run.onclick = () => invokeAction(card, row);
    head.append(title, run);
    const where = document.createElement("div");
    where.className = "meta";
    where.textContent = (row.board_id || "") + " / " + (row.device || "");
    const desc = document.createElement("div");
    desc.textContent = row.description || "";
    card.append(head, where, desc);
    for (const param of row.params || []) {
      const label = document.createElement("label");
      const caption = document.createElement("span");
      const hint = paramHint(param);
      caption.textContent = hint ? (param.name + " (" + hint + ")") : param.name;
      const input = document.createElement("input");
      input.type = "number";
      input.step = "any";
      input.dataset.param = param.name;
      if (param.description) label.title = param.description;
      if (param.min != null) input.min = String(param.min);
      if (param.max != null) input.max = String(param.max);
      if (param.default != null) input.value = String(param.default);
      else if (param.min != null) input.placeholder = String(param.min);
      label.appendChild(caption);
      label.appendChild(input);
      card.appendChild(label);
    }
    root.appendChild(card);
  }
}

function readParams(card, row) {
  const params = {};
  for (const param of row.params || []) {
    const input = Array.from(card.querySelectorAll("input[data-param]")).find(
      (el) => el.dataset.param === param.name
    );
    const raw = input ? input.value.trim() : "";
    if (raw === "") {
      if (param.default != null) {
        params[param.name] = Number(param.default);
        continue;
      }
      throw new Error("パラメータ " + param.name + " を入力してください");
    }
    const value = Number(raw);
    if (!Number.isFinite(value)) {
      throw new Error("パラメータ " + param.name + " が数値ではありません");
    }
    params[param.name] = value;
  }
  return params;
}

async function loadActions() {
  if (!simId) return;
  const res = await fetch("/api/simulation/" + encodeURIComponent(simId) + "/actions");
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    setActionError(apiError(body, res.statusText));
    return;
  }
  const body = await res.json().catch(() => ({}));
  actionCatalog = body.actions || [];
  setActionError("");
  renderActions();
}

async function invokeAction(card, row) {
  if (!simId || !canInvoke()) return;
  let params;
  try {
    params = readParams(card, row);
  } catch (err) {
    setActionStatus("");
    setActionError(err.message);
    return;
  }
  actionBusy = true;
  setActionRunEnabled();
  setActionError("");
  setActionStatus(actionKey(row) + " を実行中…");
  try {
    const res = await fetch("/api/simulation/" + encodeURIComponent(simId) + "/actions", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({
        board_id: row.board_id,
        device: row.device,
        action: row.action,
        params,
      }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      setActionStatus("");
      setActionError(apiError(body, res.statusText));
      return;
    }
    setActionError("");
    setActionStatus(actionKey(row) + " を適用しました");
  } catch (err) {
    setActionStatus("");
    setActionError(err.message || "実行に失敗しました");
  } finally {
    actionBusy = false;
    setActionRunEnabled();
  }
}

function stopActionPoll() {
  if (actionPoll) {
    clearInterval(actionPoll);
    actionPoll = null;
  }
}

function startActionPoll() {
  stopActionPoll();
  loadActions();
  actionPoll = setInterval(() => {
    if (actionCatalog.length === 0 && simState !== "exited") loadActions();
  }, 2000);
}

function apiError(body, fallback) {
  if (body && body.error) {
    if (typeof body.error === "string") return body.error;
    if (body.error.message) return body.error.message;
  }
  return fallback;
}

const STREAM_DISCONNECTED = "status stream disconnected";

function setCommandError(text) {
  document.getElementById("command-error").textContent = text || "";
}

function setStatusError(text) {
  document.getElementById("status-error").textContent = text || "";
}

async function command(name) {
  if (!simId) return;
  const res = await fetch("/api/simulation/" + encodeURIComponent(simId) + "/" + name, {
    method: "POST",
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    setCommandError(apiError(body, res.statusText));
    return;
  }
  setCommandError("");
}

function applyStatus(snap) {
  const prev = simState;
  document.getElementById("vtime").textContent = formatTime(snap.virtual_time_ns);
  document.getElementById("vraw").textContent = (snap.virtual_time_ns ?? 0) + " ns";
  setStatusError(snap.state === "exited" ? "arbiter has exited" : "");
  renderNodes(snap.nodes || []);
  setButtons(snap.state);
  if (snap.state === "running" && prev !== "running") loadActions();
}

function connectStreams() {
  if (statusSource) statusSource.close();
  if (logSource) logSource.close();
  if (probeSource) probeSource.close();
  probeLive.clear();
  renderProbes();
  statusSource = new EventSource("/api/simulation/" + encodeURIComponent(simId) + "/status");
  statusSource.addEventListener("status", (ev) => {
    try {
      applyStatus(JSON.parse(ev.data));
    } catch (_) {}
  });
  statusSource.onerror = () => {
    setStatusError(STREAM_DISCONNECTED);
  };
  logSource = new EventSource("/api/simulation/" + encodeURIComponent(simId) + "/log");
  logSource.addEventListener("log", (ev) => {
    try {
      logs.push(JSON.parse(ev.data));
      renderLogs();
    } catch (_) {}
  });
  probeSource = new EventSource("/api/simulation/" + encodeURIComponent(simId) + "/probes");
  probeSource.addEventListener("probe", (ev) => {
    try {
      const batch = JSON.parse(ev.data);
      for (const sample of batch.samples || []) {
        probeLive.set(sample.board + "/" + sample.probe, sample);
      }
      renderProbes();
    } catch (_) {}
  });
}

function showCreate() {
  document.getElementById("create").classList.remove("hidden");
  document.getElementById("sim").style.display = "none";
}

function showSim(id) {
  simId = id;
  document.getElementById("create").classList.add("hidden");
  document.getElementById("sim").style.display = "flex";
  document.getElementById("sim-id").textContent = id;
  logs.length = 0;
  actionCatalog = [];
  setActionError("");
  setActionStatus("");
  renderLogs();
  renderActions();
  connectStreams();
  startActionPoll();
}

document.getElementById("start").onclick = () => command("start");
document.getElementById("stop").onclick = () => command("stop");
document.getElementById("reset").onclick = () => command("reset");
document.getElementById("probes-csv").onclick = () => {
  if (!simId || document.getElementById("probes-csv").disabled) return;
  const link = document.createElement("a");
  link.href = "/api/simulation/" + encodeURIComponent(simId) + "/probes.csv";
  link.download = "probes.csv";
  link.click();
};
document.getElementById("actions-refresh").onclick = () => loadActions();
document.getElementById("level").onchange = () => renderLogs();
document.getElementById("logview").onscroll = (ev) => {
  const el = ev.target;
  stick = el.scrollHeight - el.scrollTop - el.clientHeight < 24;
};
document.getElementById("topofile").onchange = async (ev) => {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  document.getElementById("topotext").value = await file.text();
};
document.getElementById("topoform").onsubmit = async (ev) => {
  ev.preventDefault();
  const text = document.getElementById("topotext").value;
  const errEl = document.getElementById("create-error");
  errEl.textContent = "";
  let topology;
  try {
    topology = JSON.parse(text);
  } catch (err) {
    errEl.textContent = "JSON を解釈できません: " + err.message;
    return;
  }
  const res = await fetch("/api/simulation", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ topology }),
  });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    errEl.textContent = apiError(body, res.statusText);
    return;
  }
  location.href = "/" + encodeURIComponent(body.id);
};

const id = pathId();
if (id) {
  showSim(id);
} else {
  showCreate();
}
</script>
</body>
</html>
